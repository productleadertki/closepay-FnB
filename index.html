<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="domain">
const POS = (() => {
  const products = [
    {id:'susu',name:'Es Susu',category:'Minuman',price:5000,groups:[{name:'Varian susu',required:true,choices:[['Putih',0],['Cokelat',0]]}]},
    {id:'mie',name:'Mie Nyemek',category:'Makanan',price:9000,groups:[{name:'Tambahan Lauk',choices:[['Sosis',5000],['Telur Rebus',5000]]},{name:'Level Pedas',required:true,choices:[['Pedas',0],['Pedas Banget',2000],['Tidak Pedas',0]]}]},
    {id:'risol',name:'Risol Mayo',category:'Snack',price:2500,groups:[]}
  ];
  const validQty=qty=>Number.isSafeInteger(qty)&&qty>=1&&qty<=999;
  const item = (id,options=[],note='',qty=1) => {
    if(!validQty(qty))throw Error('Jumlah harus 1–999 porsi');
    const p=products.find(p=>p.id===id);
    if(!p)throw Error('Produk tidak ditemukan');
    for(const g of p.groups)if(g.required&&g.choices.filter(([v])=>options.includes(v)).length!==1)throw Error('Pilih satu '+g.name.toLowerCase());
    const choices=p.groups.flatMap(g=>g.choices).filter(([v])=>options.includes(v));
    if(choices.length!==options.length)throw Error('Pilihan tidak valid');
    return {id,name:p.name,options:choices.map(([v])=>v),price:p.price+choices.reduce((a,[,b])=>a+b,0),qty,note:note.trim().slice(0,120)};
  };
  const itemDetails=x=>{
    const labels={'Tambahan Lauk':'Tambahan lauk','Level Pedas':'Level pedas','Varian susu':'Varian susu'};
    const groups=products.find(p=>p.id===x.id)?.groups||[];
    const details=groups.map(g=>[labels[g.name]||g.name,g.choices.map(([v])=>v).filter(v=>x.options.includes(v)).join(', ')]).filter(([,v])=>v);
    if(x.note)details.push(['Catatan',x.note]);
    return details;
  };
  const matchesBill=(o,query)=>{
    const q=query.trim().toLowerCase();
    if(!q||(o.customer||'Walk in').toLowerCase().includes(q))return true;
    const table=(o.table||'').toLowerCase(),key=q.replace(/^meja\s+/,''),norm=x=>x.replace(/^0+(?=\d+$)/,'');
    return Boolean(table&&key&&(table===key||(/^\d+$/.test(key)&&norm(table)===norm(key))||(!/^\d+$/.test(key)&&table.includes(key))));
  };
  const active=x=>x.qty-(x.cancelled||0);
  const total=lines=>lines.reduce((sum,x)=>sum+x.price*active(x),0);
  const counts=lines=>lines.reduce((s,x)=>({active:s.active+active(x),ready:s.ready+(x.ready||0),served:s.served+(x.served||0)}),{active:0,ready:0,served:0});
  const deadline=(date,minutes)=>new Date(Date.parse(date)+minutes*60000).toISOString();
  const order=(lines,{id,type,customer='',table='',cashier='',minutes=15,date=new Date().toISOString()})=>{
    if(!lines.length)throw Error('Keranjang kosong');
    if(!Number.isInteger(minutes)||minutes<1||minutes>180)throw Error('Estimasi harus 1–180 menit');
    return {id,type,customer,table,cashier,date,completedAt:null,due:deadline(date,minutes),updated:date,lines:lines.map(x=>({...x,options:[...x.options],cancelled:0,ready:0,served:0})),status:'Menunggu',paid:false,method:'',total:total(lines)};
  };
  const migrate=o=>({...o,cashier:o.cashier||'',completedAt:o.completedAt||null,due:o.due||deadline(o.date,15),lines:o.lines.map(x=>({note:'',cancelled:o.status==='Dibatalkan'?x.qty:0,ready:['Siap','Selesai'].includes(o.status)?x.qty:0,served:o.status==='Selesai'?x.qty:0,...x})),total:o.status==='Dibatalkan'?0:o.total});
  const pay=(o,method,received=0)=>{
    if(o.paid||o.status==='Dibatalkan')throw Error('Tagihan sudah lunas atau dibatalkan');
    if(!['Tunai','QRIS'].includes(method))throw Error('Metode tidak valid');
    if(method==='Tunai'&&(!Number.isSafeInteger(received)||received<o.total))throw Error('Uang diterima masih kurang');
    return {...o,paid:true,method,received:method==='Tunai'?received:o.total,change:method==='Tunai'?received-o.total:0};
  };
  const changed=(o,patch)=>({...o,...patch,updated:new Date().toISOString()});
  const start=o=>{if(o.status!=='Menunggu')throw Error('Pesanan tidak lagi menunggu');return changed(o,{status:'Diproses'});};
  const update=(o,index,fn)=>{if(!o.lines[index])throw Error('Item tidak ditemukan');return o.lines.map((x,i)=>i===index?fn(x):x);};
  const progress=(o,lines)=>{const c=counts(lines),next=changed(o,{lines,status:c.served===c.active?'Selesai':c.ready===c.active?'Siap':'Diproses'});return next.status==='Selesai'?{...next,completedAt:next.updated}:next;};
  const ready=(o,index)=>{
    if(o.status!=='Diproses')throw Error('Pesanan tidak sedang dimasak');
    return progress(o,update(o,index,x=>{if(x.ready>=active(x))throw Error('Tidak ada porsi tersisa');return {...x,ready:x.ready+1};}));
  };
  const serve=(o,index)=>{
    if(!['Diproses','Siap'].includes(o.status))throw Error('Porsi belum siap diantar');
    return progress(o,update(o,index,x=>{if(x.served>=x.ready)throw Error('Porsi belum siap diantar');return {...x,served:x.served+1};}));
  };
  const cancel=(o,index)=>{
    if(o.paid)throw Error('Tagihan sudah lunas');
    if(o.status!=='Menunggu')throw Error('Pembatalan hanya sebelum pesanan mulai dimasak');
    const lines=index===undefined?o.lines.map(x=>({...x,cancelled:x.qty})):update(o,index,x=>{if(!active(x))throw Error('Item sudah dibatalkan');return {...x,cancelled:(x.cancelled||0)+1};});
    return changed(o,{lines,total:total(lines),status:counts(lines).active?'Menunggu':'Dibatalkan'});
  };
  return {products,item,validQty,itemDetails,matchesBill,total,active,counts,order,migrate,pay,start,ready,serve,cancel};
})();
</script>

function seed(){
 const old=new Date(); old.setDate(old.getDate()-2); old.setHours(16,10,0,0);
 const menu=(id,opts,qty)=>({...POS.item(id,opts),qty});
 const li=[[menu('susu',['Putih'],4),menu('mie',['Sosis','Telur Rebus','Tidak Pedas'],3),menu('risol',[],16)],[POS.item('susu',['Putih'])],[POS.item('risol')],[POS.item('risol')],[POS.item('susu',['Putih'])],[POS.item('susu',['Putih'])],[POS.item('mie',['Pedas'])],[POS.item('susu',['Putih'])],[POS.item('mie',['Pedas'])],[POS.item('susu',['Putih'])]];
 const orders=li.map((lines,i)=>{
  const stamp=i<2?new Date():new Date(old); if(i<2)stamp.setHours(8,49+i*3,0,0);
  let o=POS.order(lines,{id:i+1,type:types[0],cashier:CASHIER,customer:i===0?'Demo':i<2?'':'Pelanggan demo',table:i===1?'':'1',date:stamp.toISOString()});
  if([0,1,8,9].includes(i))o=POS.pay(o,'Tunai',o.total);
  if(i<2 || i===7) o={...o,status:'Selesai',completedAt:new Date(stamp.getTime()+5*60000).toISOString(),lines:o.lines.map(x=>({...x,ready:x.qty,served:x.qty}))};
  return o;
 });
 return {cart:[],customer:'',table:'',minutes:15,type:types[0],orders,next:11,shift:true,opening:0,lastClose:0,cashlog:[{type:'Kas awal',value:0,date:old.toISOString(),previous:0}]};
}
function loadState(){try{const saved=JSON.parse(localStorage.getItem(KEY));return saved?{customer:'',table:'',minutes:15,...saved,orders:saved.orders.map(POS.migrate)}:seed()}catch{return seed()}}

const noteHtml=x=>x.note?`<p class="item-note">Catatan: ${esc(x.note)}</p>`:'';
const orderFields=()=>`<section class="order-fields" aria-label="Informasi pemesan"><label>Nama pemesan<input maxlength="48" data-input="customer" value="${esc(state.customer)}" placeholder="Nama pelanggan"></label>${state.type===types[0]?`<label>Meja<input maxlength="12" data-input="table" value="${esc(state.table)}" placeholder="No. meja"></label>`:''}<label class="estimate">Target siap (menit)<input type="number" min="1" max="180" step="1" data-input="minutes" value="${esc(state.minutes)}" aria-label="Target siap dalam menit"></label></section>`;
const pos=()=>`<main class="pos"><section class="catalog"><div class="between cathead"><h1>Katalog menu</h1><div class="searchbar">${searchBox('search','Cari menu atau produk')}<button class="iconbtn" data-action="code" aria-label="Cari dengan kode produk">${icon('scan')}</button></div></div><div class="between filters"><div class="chips">${['Semua','Makanan','Minuman','Snack'].map(x=>chip('category',x,x===view.category)).join('')}</div><div class="inline"><select class="filterselect" aria-label="Urutkan produk" data-input="sort"><option value="default">↕ Default</option><option value="low" ${view.sort==='low'?'selected':''}>Harga terendah</option><option value="high" ${view.sort==='high'?'selected':''}>Harga tertinggi</option></select><span class="pill muted">${icon('calendar')} Semua waktu</span></div></div><div class="products" id="products">${products()}</div></section><aside class="basket"><div class="basket-head"><div class="between"><h2>Pesanan aktif</h2><small>${tally()} item di cart</small></div><select data-input="type" aria-label="Tipe pesanan">${types.map(t=>`<option ${state.type===t?'selected':''}>${t}</option>`).join('')}</select></div>${orderFields()}<div class="basket-body">${!state.cart.length?empty('Cart masih kosong','Tambahkan menu dari katalog untuk memulai transaksi baru.','bag'):`<button class="ghost danger" data-action="clear">${icon('trash')} Hapus keranjang</button>${state.cart.map((x,i)=>`<div class="cartline">${img(x.id)}<div><div class="between"><strong>${x.name}</strong><button class="ghost" data-action="edit" data-value="${i}" aria-label="Ubah pilihan ${x.name}">${icon('sliders')}</button></div>${x.options.length?`<p class="muted">Add-on: ${x.options.join(', ')}</p>`:''}${noteHtml(x)}<div class="between"><span class="amount">${rp(x.price*x.qty)}</span><div class="inline stepper"><button class="danger" data-action="minus" data-value="${i}" aria-label="Kurangi ${x.name}">${x.qty===1?icon('trash'):'−'}</button><span>${x.qty}</span><button class="add" data-action="plus" data-value="${i}" aria-label="Tambah jumlah ${x.name}">+</button></div></div></div></div>`).join('')}`}</div><div class="basket-foot"><small>Total pesanan</small><div class="bigmoney" id="cart-total">${rp(POS.total(state.cart))}</div><button class="primary wide" data-action="checkout" ${state.cart.length?'':'disabled'}>Lanjut ke checkout</button></div></aside></main>`;
function paymentFields(total){return `<div class="methods" aria-label="Metode pembayaran">${[['Tunai','cash','Uang tunai'],['QRIS','scan','Simulasi pindai kode QR']].map(([m,i,d])=>`<button type="button" class="${view.method===m?'selected':''}" data-action="method" data-value="${m}" aria-pressed="${view.method===m}">${icon(i)} <span>${m}<small>${d}</small></span></button>`).join('')}</div>${view.method==='Tunai'?`<label for="received"><b>Uang diterima</b></label><div class="moneyinput"><b>Rp</b><input id="received" inputmode="numeric" autocomplete="off" data-input="received" value="${view.received?fmt.format(view.received):''}" placeholder="0"><button class="ghost" type="button" data-action="preset" data-value="0" aria-label="Kosongkan nominal">${icon('x')}</button></div><div class="presets">${[total,10000,20000,50000,100000].map((n,i)=>`<button type="button" class="${view.received===n?'selected':''}" data-action="preset" data-value="${n}">${i===0?'Uang pas':rp(n)}</button>`).join('')}</div>`:`<div class="qrbox">${icon('scan')}<h3>QRIS simulasi</h3><p class="muted">Tidak ada kode yang dapat dipindai dan tidak ada dana yang berpindah.</p></div>`}`}
function balanceData(total){const diff=view.received-total;return view.method==='QRIS'?['Pembayaran','QRIS','neutral']:diff<0?['Kekurangan',rp(-diff),'short']:diff>0?['Kembalian',rp(diff),'over']:['Uang pas',rp(0),'neutral']}
const change=total=>{const [label,amount,tone]=balanceData(total);return `<div class="between change ${tone}" id="payment-balance" role="status"><b id="change-label">${label}</b><strong id="change-amount">${amount}</strong></div>`};
function totals(subtotal,discount=0){return `<div class="pay-totals"><div class="between"><span>Subtotal item</span><b>${rp(subtotal)}</b></div><div class="between"><span>Biaya tambahan</span><b>${rp(0)}</b></div>${discount?`<div class="between cancelled-text"><span>Item dibatalkan</span><b>−${rp(discount)}</b></div>`:''}<div class="between grand"><span>Total pembayaran</span><strong>${rp(subtotal-discount)}</strong></div></div>`}
const billOrders=()=> (view.billFilter==='cancelled'?state.orders.filter(o=>o.status==='Dibatalkan').sort((a,b)=>b.updated.localeCompare(a.updated)):pending()).filter(o=>POS.matchesBill(o,view.billSearch));
const currentBill=()=>billOrders().find(x=>x.id===view.billId)||billOrders()[0];
const canCancel=o=>!o.paid&&o.status==='Menunggu';
function billItems(o){const showCancel=o.status!=='Dibatalkan';return `<div class="table-scroll bill-table"><table><thead><tr><th>Pesanan</th><th>Porsi</th><th>Nominal</th>${showCancel?'<th>Aksi</th>':''}</tr></thead><tbody>${o.lines.map((x,i)=>`<tr class="${POS.active(x)?'':'cancelled-row'}"><td><b>${x.name}</b>${x.options.length?`<br><small>${x.options.join(', ')}</small>`:''}${noteHtml(x)}${x.cancelled?`<div>${tag(`${x.cancelled} porsi dibatalkan`,'red')}</div>`:''}</td><td>${POS.active(x)} / ${x.qty}</td><td>${rp(POS.active(x)*x.price)}${x.cancelled?`<br><small class="cancelled-text">−${rp(x.cancelled*x.price)}</small>`:''}</td>${showCancel?`<td>${canCancel(o)&&POS.active(x)?`<button class="danger" data-action="cancel-item" data-value="${o.id}" data-line="${i}" aria-label="Batalkan satu porsi ${x.name}">Batalkan 1 porsi</button>`:'—'}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function bills(){const cancelled=state.orders.filter(x=>x.status==='Dibatalkan').length;return `<main class="screen bills-screen"><h1>Tagihan tertunda</h1><p class="subtitle muted">Pilih tagihan untuk melihat item, pembatalan, dan pembayaran.</p><div class="bill-summary"><div><small>Total tagihan ${view.billFilter==='cancelled'?'dibatalkan':'belum lunas'}</small><strong id="bill-sum">${rp(billOrders().reduce((n,x)=>n+x.total,0))}</strong><small id="bill-count" aria-live="polite">${billOrders().length} tagihan</small></div>${searchBox('billSearch','Cari nama pelanggan atau nomor meja')}</div><div class="chips bill-filters">${[['pending',`Belum lunas (${pending().length})`],['cancelled',`Dibatalkan (${cancelled})`]].map(([k,t])=>`<button class="chip ${view.billFilter===k?'active':''}" data-action="bill-filter" data-value="${k}" aria-pressed="${view.billFilter===k}">${t}</button>`).join('')}</div><div id="bill-results">${billResults()}</div></main>`}
function billResults(){const list=billOrders(),o=currentBill();return o?`<div class="bills bill-layout"><section class="card bills-list"><h3>Daftar tagihan</h3><div class="table-scroll"><table><thead><tr><th>Antrean / Pemesan</th><th>Tagihan</th></tr></thead><tbody>${list.map(x=>`<tr class="${x.id===o.id?'current':''}"><td><button class="ghost" data-action="bill" data-value="${x.id}" aria-pressed="${x.id===o.id}"><b>#${queue(x.id)}</b><br>${esc(x.customer||'Walk in')}${x.table?' · Meja '+esc(x.table):''}</button></td><td><b>${rp(x.total)}</b><br>${statusTag(x)}</td></tr>`).join('')}</tbody></table></div></section><article class="card bill-card bill-details"><div class="between card-head"><div><h2>#${queue(o.id)}</h2><small>${esc(o.customer||'Walk in')}${o.table?' · Meja '+esc(o.table):''} · ${o.type}</small></div><div class="bill-head-actions">${statusTag(o)}${canCancel(o)?`<button class="danger" data-action="cancel-order" data-value="${o.id}">Batalkan pesanan</button>`:''}</div></div><div class="card-body"><h3>Rincian pesanan</h3>${billItems(o)}${o.status!=='Dibatalkan'&&!canCancel(o)?'<p class="muted locked">Pembatalan terkunci karena pesanan sudah mulai dimasak.</p>':''}${totals(o.lines.reduce((n,x)=>n+x.price*x.qty,0),o.lines.reduce((n,x)=>n+x.price*(x.cancelled||0),0))}${o.status!=='Dibatalkan'?`<h3>Terima pembayaran</h3>${paymentFields(o.total)}<p class="err" id="bill-error" role="alert"></p>`:''}</div>${o.status!=='Dibatalkan'?`<div class="card-foot">${change(o.total)}<div class="actionrow"><button class="primary" data-action="pay-bill" data-value="${o.id}">Tagih sekarang</button></div></div>`:''}</article></div>`:empty(view.billSearch.trim()?'Tagihan tidak ditemukan':view.billFilter==='pending'?'Tidak ada tagihan tertunda':'Tidak ada pesanan dibatalkan',view.billSearch.trim()?'Coba nama atau nomor meja yang lain.':'')}

const tag=(text,kind)=>`<span class="tag ${kind}">${text}</span>`;
const statusTag=o=>tag(o.status,{Menunggu:'amber',Siap:'green',Selesai:'green',Dibatalkan:'red'}[o.status]||'');
function historyRows(){const q=view.historySearch.trim().toLowerCase();const rows=state.orders.filter(o=>(view.historyStatus==='Semua'||o.status===view.historyStatus)&&(view.historyDate==='all'||localDay(o.date)===localDay(now()))&&`${code(o)} ${queue(o.id)} ${o.customer||'Walk in'} ${o.type} ${o.table} ${o.cashier}`.toLowerCase().includes(q)).sort((a,b)=>view.timeSort==='recent'?b.date.localeCompare(a.date):a.date.localeCompare(b.date));return [rows.length,rows.length?rows.map(o=>`<tr><td>#${code(o)}</td><td>${queue(o.id)}</td><td class="muted">${localDay(o.date)===localDay(now())?time(o.date):day(o.date,{day:'numeric',month:'short'})+', '+time(o.date)}</td><td>${o.table?'Meja '+esc(o.table)+' · ':''}${esc(o.customer||'Walk in')} · ${o.type}</td><td>${esc(o.cashier||'—')}</td><td>${o.completedAt?timeHtml(o.completedAt):'—'}</td><td>${statusTag(o)}</td><td>${o.status==='Dibatalkan'?tag('Batal','red'):o.paid?tag('Lunas','green'):tag('Belum lunas','amber')}</td><td>${o.method||'—'}</td><td>${rp(o.total)}</td><td class="inline">${canCancel(o)?`<button class="ghost danger" data-action="cancel-order" data-value="${o.id}" aria-label="Batalkan pesanan #${queue(o.id)}">Batalkan pesanan</button>`:''}<button class="ghost" data-action="detail" data-value="${o.id}" aria-label="Detail #${queue(o.id)}">${icon('eye')}</button></td></tr>`).join(''):`<tr><td colspan="11">${empty('Tidak ada transaksi yang cocok','Ubah pencarian atau filter.')}</td></tr>`]}
function historyPage(){const [count,rows]=historyRows();return `<main class="screen"><div class="between headingrow"><div><h1>Riwayat</h1><p class="subtitle muted">Cari pesanan dan tinjau status pembayarannya.</p></div>${searchBox('historySearch','Cari pesanan, pelanggan, atau kasir')}</div><div class="history-filter"><div class="between"><small>Status order</small><span class="pill" id="count">${count} order</span></div><div class="chips">${statusList.map(x=>chip('historyStatus',x,x===view.historyStatus)).join('')}</div></div><section class="tablecard"><div class="between tablehead"><h3>Semua transaksi</h3><select data-input="historyDate" aria-label="Filter tanggal"><option value="all">Semua tanggal</option><option value="today" ${view.historyDate==='today'?'selected':''}>Hari ini</option></select></div><div class="table-scroll"><table><thead><tr><th>Order</th><th>Antrian</th><th><button class="ghost" data-action="timeSort">Order masuk ${view.timeSort==='recent'?'↓':'↑'}</button></th><th>Pelanggan / Tipe order</th><th>Kasir</th><th>Order selesai</th><th>Status pesanan</th><th>Status bayar</th><th>Bayar</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody id="rows">${rows}</tbody></table></div></section></main>`}
const cashPage=()=>`<main class="screen cash"><h1>Kas harian</h1><div class="cashwrap"><small>${icon('calendar')} ${day(now())}</small><section class="card cash-summary"><div><div class="inline"><span class="symbol">${icon('cash')}</span><div><h3>${state.shift?'Kas sedang berjalan':'Kas sudah ditutup'}</h3><p class="muted">${state.shift?'Kas awal sudah dicatat. Tutup kas saat shift selesai.':'Buka kas untuk memulai shift berikutnya.'}</p></div></div><button class="primary" data-action="shift">${state.shift?'Isi kas akhir':'Isi kas awal'}</button></div><aside><small>${icon('bill')} Kas penutupan sebelumnya</small><h3>${rp(state.lastClose)}</h3></aside></section><div class="between"><h3>Riwayat kas</h3><small>${state.cashlog.length} catatan ditampilkan</small></div><div class="card cashlog">${state.cashlog.map(x=>`<div class="between"><div class="inline"><span class="symbol">${icon('cash')}</span><span><b>${x.type}</b><br><small>${day(x.date,{dateStyle:'medium'})} · ${time(x.date)}</small></span></div><div style="text-align:right"><b>${rp(x.value)}</b><br><small>Sisa sebelumnya: ${rp(x.previous)}</small></div></div>`).join('')}</div></div></main>`;
const lanes=[{name:'Menunggu',statuses:['Menunggu'],tone:'wait',label:'Belum mulai dimasak'},{name:'Dimasak',statuses:['Diproses'],tone:'cook',label:'Sedang disiapkan'},{name:'Selesai',statuses:['Siap','Selesai'],tone:'done',label:'Siap diantar atau sudah diantar'}];
function countdown(due){const seconds=Math.ceil((Date.parse(due)-Date.now())/1000);if(seconds<=0)return 'Lewat target';return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
function tick(){for(const el of $$('[data-due]')){const value=countdown(el.dataset.due);if(el.textContent!==value)el.textContent=value;el.classList.toggle('late',value==='Lewat target')}}
const kitchenOptions=x=>{const details=POS.itemDetails(x);return details.length?`<dl class="kitchen-options">${details.map(([label,value])=>`<div><dt>${label}</dt><dd>${esc(value)}</dd></div>`).join('')}</dl>`:''};
function kitchenTicket(o){const c=POS.counts(o.lines),finished=o.status==='Selesai',ready=o.status==='Siap';return `<article class="card ticket kitchen-ticket"><div class="between ticket-title"><h3>#${queue(o.id)}</h3>${tag(finished?'Selesai':ready?(o.type===types[0]?'Sudah siap':'Siap diambil'):o.status==='Diproses'?'Dimasak':'Menunggu',finished||ready?'green':o.status==='Menunggu'?'amber':'')}</div><div class="ticket-meta"><b>${esc(o.customer||'Walk in')}</b><span>${o.table?'Meja '+esc(o.table):o.type}</span></div>${timeline(o)}${!finished&&!ready?`<div class="between timer-strip"><span>Target siap</span><strong class="timer" data-due="${o.due}">${countdown(o.due)}</strong></div>`:`<small>${finished?'Semua porsi sudah diserahkan':'Menunggu pengantaran / pengambilan'}</small>`}<ul>${o.lines.map((x,i)=>{const n=POS.active(x),queued=x.ready-x.served;return `<li class="kitchen-line"><span class="portion-count">${n}</span><div class="line-copy"><strong>${x.name}</strong>${kitchenOptions(x)}${x.cancelled?tag(`${x.cancelled} porsi batal`,'red'):''}${n?`<div class="line-progress">${tag(x.served===n?'Sudah diantar':queued?`${queued} siap diantar`:o.status==='Menunggu'?'Menunggu':'Dimasak',x.served===n||queued?'green':'')}${x.served>0&&x.served<n?`<small>${x.served}/${n} diserahkan</small>`:''}</div>`:''}${(o.status==='Diproses'&&x.ready<n)||queued?`<div class="line-actions">${o.status==='Diproses'&&x.ready<n?`<button data-action="ready-item" data-value="${o.id}" data-line="${i}">Siapkan 1</button>`:''}${queued?`<button class="primary" data-action="serve-item" data-value="${o.id}" data-line="${i}">${o.type===types[0]?'Antar 1':'Serahkan 1'}</button>`:''}</div>`:''}</div></li>`}).join('')}</ul><div class="progress-caption"><span>Diserahkan</span><b>${c.served} / ${c.active} porsi</b></div><progress value="${c.served}" max="${c.active}" aria-label="Porsi diserahkan"></progress>${o.status==='Menunggu'?`<button class="primary wide start-cook" data-action="start-cook" data-value="${o.id}">Mulai masak</button>`:''}</article>`}
function kitchen(){const today=state.orders.filter(o=>localDay(o.completedAt||o.date)===localDay(now())||['Menunggu','Diproses','Siap'].includes(o.status));const groups=lanes.map(x=>({...x,orders:today.filter(o=>x.statuses.includes(o.status))}));return `<main class="screen kitchen"><div class="between"><div><h1>Antrean dapur</h1><p class="muted subtitle">Pesanan aktif dan pesanan selesai hari ini.</p></div><small>Diperbarui ${time(now())}</small></div><div class="queue-stats" aria-label="Ringkasan antrean">${groups.map(g=>{const ready=g.orders.filter(o=>o.status==='Siap').length;return `<article class="queue-stat ${g.tone}"><div class="inline"><i class="dot"></i><b>${g.name}</b></div><strong data-queue="${g.tone}">${g.orders.length}</strong><small>${g.tone==='done'?`${ready} siap diantar · ${g.orders.length-ready} selesai`:g.label}</small></article>`}).join('')}</div><div class="lanes">${groups.map(g=>`<section class="lane"><div class="between lane-head"><h2>${g.name}</h2><small>${g.orders.length} pesanan</small></div>${g.orders.length?g.orders.map(kitchenTicket).join(''):empty('Belum ada pesanan')}</section>`).join('')}</div></main>`}

function render(){root.innerHTML=nav()+({pos,bills,history:historyPage,cash:cashPage,kitchen})[view.page]();if(view.page==='kitchen')tick()}
function initPayment(total){view.method='Tunai';view.received=total}
function setBill(id){view.billId=id;initPayment(currentBill()?.total||0)}
function go(page){view.page=page;if(page==='bills')setBill(null);render();window.scrollTo(0,0)}
let modalData=null;
function modal(title,body,data={}){modalData=data;dlg.innerHTML=`<div class="between"><h2 id="dialog-title">${title}</h2><button class="ghost" data-action="close" aria-label="Tutup">${icon('x')}</button></div>${body}`;if(!dlg.open)dlg.showModal()}
const close=()=>dlg.close();
const actionRow=(cancel,confirm,act)=>`<div class="actionrow"><button type="button" data-action="close">${cancel}</button><button class="primary" type="${act?'button':'submit'}" ${act?`data-action="${act}"`:''}>${confirm}</button></div>`;
function variant(id,index){
 const p=POS.products.find(p=>p.id===id);if(!p)return;
 const prev=state.cart[index];
 modal(p.groups.length?'Pilih varian':'Tambah menu',`<p class="muted">${p.name}</p><form id="variant-form">${p.groups.map((g,i)=>`<div class="section"><b>${g.name}</b><br><small>${g.required?'Pilih satu · Wajib':'Opsional'}</small></div>${g.choices.map(([name,price])=>`<label class="opt">${name}<span class="opt-price">${rp(price)}</span><input type="${g.required?'radio':'checkbox'}" name="group${i}" value="${name}" data-price="${price}" ${g.required?'required':''} ${prev?.options.includes(name)?'checked':''}></label>`).join('')}`).join('')}<label class="stacklabel section">Catatan item <textarea name="note" maxlength="120" rows="2" placeholder="Misalnya: saus dipisah, tanpa bawang">${esc(prev?.note||'')}</textarea><small>Opsional · maks. 120 karakter · ditampilkan di dapur</small></label><div class="variant-qty"><label for="item-qty"><b>Jumlah porsi</b></label><div class="inline"><button type="button" data-action="qty-step" data-value="-1" aria-label="Kurangi jumlah porsi" ${(prev?.qty??1)<=1?'disabled':''}>−</button><input id="item-qty" name="qty" type="number" inputmode="numeric" min="1" max="999" step="1" value="${(prev?.qty??1)}" required><button type="button" data-action="qty-step" data-value="1" aria-label="Tambah jumlah porsi" ${(prev?.qty??1)>=999?'disabled':''}>+</button></div></div><div class="between var-total"><span class="muted">Total item</span><strong class="opt-price" id="var-total">${rp((prev?.price??p.price)*(prev?.qty??1))}</strong></div><p class="err" id="variant-error" role="alert">${prev?.qty>999?'Jumlah tersimpan melebihi batas 999. Ubah jumlah secara manual sebelum menyimpan.':''}</p>${actionRow('Batal',prev?'Simpan perubahan':'Tambah ke pesanan')}</form>`,{kind:'variant',id,index,base:p.price});
}

function updateVariantTotal(){
 const qty=Number($('#item-qty').value),unit=modalData.base+$$('#variant-form input[data-price]:checked').reduce((n,x)=>n+Number(x.dataset.price),0);
 $('#var-total').textContent=POS.validQty(qty)?rp(qty*unit):'—';
 $('[data-action=qty-step][data-value="-1"]').disabled=qty<=1;
 $('[data-action=qty-step][data-value="1"]').disabled=qty>=999;
 payError('#variant-error','');
}
function addLine(item,index){
 const match=state.cart.find((x,i)=>i!==index&&x.id===item.id&&x.options.join('|')===item.options.join('|')&&(x.note||'')===item.note);
 if(match&&!POS.validQty(match.qty+item.qty))throw Error('Jumlah untuk pilihan ini maksimal 999 porsi');
 if(index!==undefined)state.cart.splice(index,1);
 if(match)match.qty+=item.qty;else state.cart.splice(index??state.cart.length,0,item);
 save();close();render();
}
const summaries=lines=>lines.map(x=>`<div class="between summary"><span><b>${POS.active(x)} × ${x.name}</b>${x.options.length?`<br><small>${x.options.join(', ')}</small>`:''}${noteHtml(x)}${x.cancelled?`<div>${tag(`${x.cancelled} porsi dibatalkan`,'red')}</div>`:''}</span><b>${rp(POS.active(x)*x.price)}</b></div>`).join('');
function checkout(){
 if(!state.cart.length)return;
 if(!Number.isInteger(Number(state.minutes))||Number(state.minutes)<1||Number(state.minutes)>180){notify('Isi target siap antara 1–180 menit.');$('[data-input=minutes]').focus();return;}
 const total=POS.total(state.cart);initPayment(total);
 modal('Checkout',`<p class="muted">Periksa pesanan sebelum menerima pembayaran.</p><form id="checkout-form"><div class="checkout-grid"><section><div class="checkout-heading"><h3>Rincian pesanan</h3><span class="pill">${tally()} porsi</span></div><p class="order-context"><b>${esc(state.customer.trim()||'Walk in')}</b> · ${state.type}${state.type===types[0]&&state.table.trim()?' · Meja '+esc(state.table.trim()):''}<br><small>Target siap ${Number(state.minutes)} menit setelah dipesan</small></p>${summaries(state.cart)}</section><section><h3>Total dan pembayaran</h3>${totals(total)}<div id="checkout-payment">${paymentFields(total)}${change(total)}</div><p class="err" id="checkout-error" role="alert"></p></section></div><div class="actionrow checkout-actions"><button type="button" data-action="defer">Tagih nanti</button><button class="primary" type="submit">${view.method==='QRIS'?'Simulasi bayar':'Bayar sekarang'}</button></div></form>`,{kind:'checkout',total});
}

const payError=(target,text)=>{const el=$(target);if(el)el.textContent=text};
function finishCheckout(defer){
 let o=POS.order(state.cart,{id:state.next,type:state.type,cashier:CASHIER,customer:state.customer.trim(),table:state.type===types[0]?state.table.trim():'',minutes:Number(state.minutes)});
 if(!defer){try{o=POS.pay(o,view.method,view.received)}catch(err){payError('#checkout-error',err.message);return}}
 state.next++;state.orders.unshift(o);state.cart=[];state.customer='';state.table='';state.minutes=15;save();close();render();notify(defer?`Pesanan #${queue(o.id)} masuk dapur dan Tagih nanti.`:`Pembayaran #${queue(o.id)} berhasil. Pesanan masuk dapur.`);
}
function detail(o){modal(`Pesanan #${queue(o.id)}`,`<p class="muted">${code(o)} · ${o.type} · ${esc(o.customer||'Walk in')}</p><p class="muted">Kasir: ${esc(o.cashier||'Tidak tercatat')}</p>${timeline(o)}<div class="section">${statusTag(o)} ${o.paid?tag('Lunas','green'):o.status==='Dibatalkan'?tag('Batal','red'):tag('Belum lunas','amber')}</div>${summaries(o.lines)}<div class="between section"><b>Total</b><h2>${rp(o.total)}</h2></div>${o.paid?`<p class="muted">${o.method} · Diterima ${rp(o.received)} · Kembalian ${rp(o.change)}</p>`:''}`)}
function confirmAction(title,desc,act,value){modal(title,`<p class="section muted">${desc}</p>${actionRow('Kembali','Ya, lanjutkan',act)}`,{value})}
function refreshPayment(){if(modalData?.kind==='checkout'&&dlg.open){const n=modalData.total;$('#checkout-payment').innerHTML=paymentFields(n)+change(n);payError('#checkout-error','');$('#checkout-form button[type=submit]').textContent=view.method==='QRIS'?'Simulasi bayar':'Bayar sekarang'}else render()}
function updateReceived(el){view.received=digits(el.value.slice(0,20));el.value=view.received?fmt.format(view.received):'';const t=(dlg.open&&modalData?.kind==='checkout')?modalData.total:currentBill()?.total||0;const [label,amount,tone]=balanceData(t);$('#change-label').textContent=label;$('#change-amount').textContent=amount;$('#payment-balance').className='between change '+tone;$$('.presets button').forEach(b=>b.classList.toggle('selected',Number(b.dataset.value)===view.received));payError('#checkout-error','');payError('#bill-error','')}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;const {action:a,value:v}=b.dataset;const n=Number(v);
 switch(a){
  case 'nav':go(v);break;
  case 'category':case 'historyStatus':view[a]=v;render();break;
  case 'timeSort':view.timeSort=view.timeSort==='recent'?'old':'recent';render();break;
  case 'add':variant(v);break;
  case 'edit':variant(state.cart[n].id,n);break;
  case 'plus':if(POS.validQty(state.cart[n].qty+1)){state.cart[n].qty++;save();render()}else notify('Jumlah maksimal 999 porsi');break;
  case 'qty-step':{const f=$('#item-qty');f.value=Math.max(1,(Number(f.value)||0)+n);updateVariantTotal();break}
  case 'minus':if(--state.cart[n].qty<=0)state.cart.splice(n,1);save();render();break;
  case 'clear':confirmAction('Hapus keranjang?','Semua menu di pesanan aktif akan dihapus.','confirm-clear');break;
  case 'confirm-clear':state.cart=[];save();close();render();break;
  case 'checkout':checkout();break;
  case 'defer':finishCheckout(true);break;
  case 'bill':setBill(n);render();break;
  case 'bill-filter':view.billFilter=v;setBill(null);render();break;
  case 'method':view.method=v;refreshPayment();break;
  case 'preset':view.received=n;refreshPayment();break;
  case 'pay-bill':try{replaceOrder(POS.pay(byId(n),view.method,view.received));setBill(null);render();notify(`Tagihan #${queue(n)} lunas.`)}catch(err){payError('#bill-error',err.message)}break;
  case 'cancel-order':case 'cancel-item':{
   const o=byId(n);if(!canCancel(o))break;
   const index=a==='cancel-item'?Number(b.dataset.line):undefined;
   const after=index===undefined?0:o.total-o.lines[index].price;
   const desc=index===undefined?'Semua porsi yang tersisa akan dibatalkan dan pesanan dikeluarkan dari antrean dapur.':`Satu porsi ${o.lines[index].name} akan dibatalkan. Porsi lainnya tetap diproses jika masih ada.`;
   modal(index===undefined?`Batalkan pesanan #${queue(n)}?`:`Batalkan 1 porsi ${o.lines[index].name}?`,`<p class="section muted">${desc} Pembatalan tidak bisa diurungkan.</p><div class="cancel-preview between"><span>Tagihan setelah pembatalan</span><strong>${rp(after)}</strong></div><div class="actionrow"><button type="button" data-action="close">Kembali</button><button type="button" class="danger" data-action="confirm-cancel">${index===undefined?'Ya, batalkan pesanan':'Ya, batalkan 1 porsi'}</button></div>`,{orderId:n,index});break;
  }
  case 'confirm-cancel':try{
   const {orderId,index}=modalData,previous=byId(orderId),next=POS.cancel(previous,index);
   replaceOrder(next);close();if(view.page==='bills'&&next.status==='Dibatalkan')view.billFilter='cancelled';setBill(orderId);if(view.page==='bills'&&next.status!=='Dibatalkan')view.received=next.total;render();notify(next.status==='Dibatalkan'?'Pesanan dibatalkan.':'Satu porsi dibatalkan. Total diperbarui.');
  }catch(err){close();notify(err.message)}break;
  case 'start-cook':case 'ready-item':case 'serve-item':try{
   const o=byId(n),index=Number(b.dataset.line);
   const next=(a==='start-cook'?POS.start:a==='ready-item'?POS.ready:POS.serve)(o,index);
   replaceOrder(next);render();
   if(a==='serve-item'&&next.status==='Selesai')notify('Semua porsi sudah diserahkan.');
  }catch(err){notify(err.message)}break;

  case 'detail':detail(byId(n));break;
  case 'shift':modal(state.shift?'Isi kas akhir':'Isi kas awal',`<form id="shift-form"><label class="stacklabel section">Nominal kas (Rp)<input inputmode="numeric" name="amount" required pattern="[0-9.]+" maxlength="15" placeholder="0"></label>${actionRow('Batal','Simpan')}</form>`,{kind:'shift'});break;
  case 'code':modal('Cari dengan kode produk',`<form id="code-form"><label class="stacklabel section">Kode produk<input name="code" placeholder="SUSU, MIE, atau RISOL" required></label><p class="err" id="code-error" role="alert"></p>${actionRow('Batal','Cari produk')}</form>`,{kind:'code'});break;
  case 'settings':confirmAction('Reset data demo?','Mengembalikan contoh pesanan, keranjang, dan kas ke kondisi awal di browser ini.','reset');break;
  case 'reset':state=seed();save();close();go('pos');view.search='';view.category='Semua';view.sort='default';view.historySearch='';view.historyStatus='Semua';view.historyDate='all';view.timeSort='recent';view.billFilter='pending';view.billSearch='';render();notify('Data demo direset.');break;
  case 'close':close();break;
 }
});
document.addEventListener('input',e=>{
 const el=e.target,k=el.dataset.input;
 if(['customer','table','minutes'].includes(k)){state[k]=el.value;save()}
 if(k==='search'){view.search=el.value;$('#products').innerHTML=products()}
 if(k==='historySearch'){view[k]=el.value;const [count,rows]=historyRows();$('#rows').innerHTML=rows;$('#count').textContent=`${count} order`}
 if(k==='billSearch'){
  const previous=currentBill()?.id;
  view.billSearch=el.value;
  if(previous!==currentBill()?.id)setBill(null);
  const matches=billOrders();
  $('#bill-sum').textContent=rp(matches.reduce((n,x)=>n+x.total,0));
  $('#bill-count').textContent=`${matches.length} tagihan`;
  $('#bill-results').innerHTML=billResults();
 }
 if(k==='received')updateReceived(el);
 if(el.closest('#variant-form'))updateVariantTotal();
});
document.addEventListener('change',e=>{const k=e.target.dataset.input;if(k==='type'){state.type=e.target.value;save();render()}if(k==='sort'||k==='historyDate'){view[k]=e.target.value;render()}});
document.addEventListener('submit',e=>{
 const form=e.target;const data=new FormData(form);e.preventDefault();
 if(form.id==='variant-form'){try{const item=POS.item(modalData.id,[...data].filter(([name])=>name.startsWith('group')).map(([,v])=>v),String(data.get('note')||''),Number(data.get('qty')));addLine(item,modalData.index)}catch(err){payError('#variant-error',err.message)}}
 if(form.id==='checkout-form')finishCheckout(false);
 if(form.id==='shift-form'){const value=digits(data.get('amount'));state.cashlog.unshift({type:state.shift?'Kas akhir':'Kas awal',value,date:now(),previous:state.lastClose});if(state.shift)state.lastClose=value;else state.opening=value;state.shift=!state.shift;save();close();render();notify(state.shift?'Kas awal dicatat.':'Kas akhir dicatat.')}
 if(form.id==='code-form'){const id=data.get('code').trim().toLowerCase();if(POS.products.some(p=>p.id===id)){close();variant(id)}else payError('#code-error','Kode tidak ditemukan. Coba SUSU, MIE, atau RISOL.')}
});
dlg.addEventListener('close',()=>{if(!dlg.open)modalData=null});
window.addEventListener('storage',e=>{if(e.key===KEY&&!dlg.open){state=loadState();if(view.page==='bills')setBill(view.billId);render()}});
render();
setInterval(tick,1000);
</script>
</body>
</html>
